# Complete local stack. HTTP and an owner database role are development only.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anbar
      POSTGRES_DB: anbar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hex password in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anbar -d anbar"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://anbar:${POSTGRES_PASSWORD}@db:5432/anbar
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ../apps/api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://anbar:${POSTGRES_PASSWORD}@db:5432/anbar
      APP_SECRET: ${APP_SECRET:?Set a persistent generated secret in .env}
      PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-8080}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      APP_DOMAIN: http://:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on: [api]
volumes:
  postgres_data:
