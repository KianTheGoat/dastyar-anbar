[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dastyar-anbar-api"
version = "0.1.0"
description = "Persian multi-tenant inventory and replenishment assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "argon2-cffi>=23,<26", "cryptography>=50,<51", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "jdatetime>=5,<6",
  "email-validator>=2,<3", "google-auth>=2,<3", "requests>=2.32,<3",
  "tzdata>=2025,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
