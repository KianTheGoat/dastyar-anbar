name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anbar_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: anbar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anbar_test -d anbar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://anbar_test:ci-only-disposable-password@127.0.0.1:5432/anbar_test
      TEST_DATABASE_URL: postgresql+psycopg://anbar_test:ci-only-disposable-password@127.0.0.1:5432/anbar_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest
        env:
          PG_TOOL_CONTAINER: ${{ job.services.postgres.id }}
      - run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
